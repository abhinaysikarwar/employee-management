version: "3.9"

services:

  mongodb:
    image: mongo:8
    container_name: mongodb
    restart: always

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

  app:
    build: .

    container_name: employee-app

    restart: always

    ports:
      - "5000:5000"

    depends_on:
      - mongodb

volumes:
  mongo-data:
